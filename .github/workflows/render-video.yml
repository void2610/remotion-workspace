name: Render Video & Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 動画レンダリング（closed以外の全イベント）
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    outputs:
      has-videos: ${{ steps.detect.outputs.has_videos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type check
        run: npm run lint

      - name: Detect changed compositions
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- src/ public/)
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 -- src/ public/)
            else
              CHANGED=$(git ls-files -- src/ public/)
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          if [ -n "$CHANGED" ]; then
            COMPOSITIONS=$(echo "$CHANGED" | node scripts/detect-compositions.mjs)
          else
            COMPOSITIONS=""
          fi

          echo "compositions=$COMPOSITIONS" >> $GITHUB_OUTPUT

          if [ -n "$COMPOSITIONS" ]; then
            echo "has_videos=true" >> $GITHUB_OUTPUT
            echo "Will render: $COMPOSITIONS"
          else
            echo "has_videos=false" >> $GITHUB_OUTPUT
            echo "No compositions to render"
          fi

      - name: Render videos
        if: steps.detect.outputs.has_videos == 'true'
        run: |
          mkdir -p out
          for comp in ${{ steps.detect.outputs.compositions }}; do
            echo "::group::Rendering $comp"
            npx remotion render src/index.ts "$comp" "out/${comp}.mp4"
            echo "::endgroup::"
          done

      - name: Prepare site
        if: steps.detect.outputs.has_videos == 'true'
        env:
          COMPOSITIONS: ${{ steps.detect.outputs.compositions }}
        run: |
          mkdir -p _site
          for comp in $COMPOSITIONS; do
            cp "out/${comp}.mp4" _site/
          done
          node scripts/generate-preview-page.mjs

      - name: Upload artifact
        if: steps.detect.outputs.has_videos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # mainブランチへのデプロイ（ルートディレクトリ）
  deploy-main:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.has-videos == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-main
      cancel-in-progress: true
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true

  # PRプレビューデプロイ（pr/<番号>/ サブディレクトリ）
  deploy-pr:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.build.outputs.has-videos == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: pr/${{ github.event.pull_request.number }}
          keep_files: true

  # PRにプレビューURLをコメント
  comment-pr:
    needs: deploy-pr
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const previewUrl = `https://${repo.owner}.github.io/${repo.repo}/pr/${prNumber}/`;
            const body = `## Preview\nデプロイが完了しました。\n${previewUrl}`;

            // 既存のプレビューコメントを検索
            const comments = await github.rest.issues.listComments({
              ...repo,
              issue_number: prNumber,
            });
            const botComment = comments.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes('## Preview')
            );

            if (botComment) {
              // 既存コメントを更新
              await github.rest.issues.updateComment({
                ...repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              // 新規コメントを作成
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body,
              });
            }

  # PRクローズ時にプレビューディレクトリを削除
  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove PR preview directory
        run: |
          PR_DIR="pr/${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "Clean up preview for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "Directory $PR_DIR does not exist, skipping cleanup"
          fi
