name: Render Video & Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has-videos: ${{ steps.detect.outputs.has_videos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type check
        run: npm run lint

      - name: Detect changed compositions
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- src/ public/)
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 -- src/ public/)
            else
              CHANGED=$(git ls-files -- src/ public/)
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          if [ -n "$CHANGED" ]; then
            COMPOSITIONS=$(echo "$CHANGED" | node scripts/detect-compositions.mjs)
          else
            COMPOSITIONS=""
          fi

          echo "compositions=$COMPOSITIONS" >> $GITHUB_OUTPUT

          if [ -n "$COMPOSITIONS" ]; then
            echo "has_videos=true" >> $GITHUB_OUTPUT
            echo "Will render: $COMPOSITIONS"
          else
            echo "has_videos=false" >> $GITHUB_OUTPUT
            echo "No compositions to render"
          fi

      - name: Render videos
        if: steps.detect.outputs.has_videos == 'true'
        run: |
          mkdir -p out
          for comp in ${{ steps.detect.outputs.compositions }}; do
            echo "::group::Rendering $comp"
            npx remotion render src/index.ts "$comp" "out/${comp}.mp4"
            echo "::endgroup::"
          done

      - name: Prepare Pages artifact
        if: steps.detect.outputs.has_videos == 'true'
        env:
          COMPOSITIONS: ${{ steps.detect.outputs.compositions }}
        run: |
          mkdir -p _site
          for comp in $COMPOSITIONS; do
            cp "out/${comp}.mp4" _site/
          done
          node scripts/generate-preview-page.mjs

      - name: Upload Pages artifact
        if: steps.detect.outputs.has_videos == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.has-videos == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
